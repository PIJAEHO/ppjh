<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원가절감 보고서 변환기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #f8f9fc;
      min-height: 100vh;
    }

    /* ── 상단 헤더 ── */
    .header {
      background: #0f1f3d;
      padding: 28px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-icon {
      width: 40px; height: 40px;
      background: #2563eb;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .header-text p  { font-size: 12px; color: #94a3b8; margin-top: 3px; }

    /* ── 본문 래퍼 ── */
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ── 드롭존 ── */
    #dropzone {
      border: 1.5px dashed #cbd5e1;
      border-radius: 16px;
      padding: 64px 24px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #dropzone:hover, #dropzone.dragover {
      border-color: #2563eb;
      background: #f0f5ff;
    }
    #dropzone.dragover::after {
      content: '놓으세요!';
      position: absolute; inset: 0;
      background: rgba(37,99,235,0.08);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #2563eb;
    }
    .drop-upload-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: #eff6ff;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      font-size: 26px;
    }
    .drop-main { font-size: 15px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
    .drop-sub  { font-size: 13px; color: #94a3b8; }
    .drop-sub span {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 14px;
      background: #f1f5f9;
      border-radius: 20px;
      font-size: 11px;
      color: #64748b;
    }
    #file-input { display: none; }

    /* ── 결과 영역 ── */
    #result-section { display: none; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
    }
    .toolbar-left .file-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar-right { display: flex; gap: 8px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-copy  { background: #2563eb; color: #fff; }
    .btn-copy:hover  { background: #1d4ed8; }
    .btn-save  { background: #fff; color: #374151; border: 1px solid #e2e8f0; }
    .btn-save:hover  { background: #f8fafc; border-color: #cbd5e1; }
    .btn-reset { background: transparent; color: #94a3b8; border: 1px solid #e2e8f0; }
    .btn-reset:hover { color: #64748b; }

    /* ── 미리보기 카드 ── */
    #preview-box {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    }

    /* ══ 게시용 리포트 카드 스타일 ══ */
    .report-card { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; }

    .report-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
      gap: 20px;
    }
    .report-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .report-main-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1.3;
    }
    .report-meta-right {
      text-align: right;
      flex-shrink: 0;
    }
    .report-meta-right .meta-label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .report-meta-right .meta-value {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .report-fields { display: flex; flex-direction: column; gap: 0; }

    .report-field {
      display: grid;
      grid-template-columns: 140px 1fr;
      border-bottom: 1px solid #f1f5f9;
    }
    .report-field:last-child { border-bottom: none; }

    .field-label {
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      background: #f8fafc;
      display: flex;
      align-items: flex-start;
      border-right: 1px solid #f1f5f9;
    }
    .field-value {
      padding: 14px 18px;
      font-size: 13.5px;
      color: #1e293b;
      line-height: 1.75;
      word-break: break-word;
    }
    .field-value img { max-width: 100%; height: auto; display: block; }

    .field-value.highlight {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .report-footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
    .report-footer span {
      font-size: 13px;
      font-weight: 500;
      color: #475569;
    }
    .receipt-input {
      border: none;
      border-bottom: 1.5px dashed #cbd5e1;
      outline: none;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: #0f172a;
      background: transparent;
      width: 100%;
      padding: 2px 0;
      transition: border-color 0.15s;
    }
    .receipt-input:focus { border-bottom-color: #2563eb; }
    .receipt-input::placeholder { color: #cbd5e1; font-weight: 400; }
    /* ══════════════════════════ */

    /* ── 토스트 ── */
    .toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #0f172a;
      color: #fff;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">📋</div>
    <div class="header-text">
      <h1>원가절감 보고서 변환기</h1>
      <p>결재 완료된 HTML 파일을 게시용으로 자동 변환합니다</p>
    </div>
  </div>

  <div class="container">

    <div id="dropzone" onclick="document.getElementById('file-input').click()">
      <div class="drop-upload-icon">📂</div>
      <div class="drop-main">HTML 파일을 드래그하거나 클릭하여 업로드</div>
      <div class="drop-sub">
        원가절감 결재 완료 파일을 여기에 놓으세요<br>
        <span>*.html / *.htm 지원</span>
      </div>
      <input type="file" id="file-input" accept=".html,.htm">
    </div>

    <div id="result-section">
      <div class="toolbar">
        <div class="toolbar-left">
          변환 완료
          <span class="file-badge" id="fname-badge"></span>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-reset" onclick="reset()">↩ 다시 변환</button>
          <button class="btn btn-save"  onclick="saveHTML()">⬇ 저장</button>
          <button class="btn btn-copy"  onclick="copyHTML()">⎘ HTML 복사</button>
        </div>
      </div>
      <div id="preview-box">
        <div id="preview"></div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const dropzone  = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const resultSec = document.getElementById('result-section');
    const preview   = document.getElementById('preview');
    const fnameBadge = document.getElementById('fname-badge');

    let generatedHTML = '';
    let savedFilename = '';
    let extractedData = {};

    dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const f = e.dataTransfer.files[0];
      if (f) processFile(f);
    });
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) processFile(e.target.files[0]);
    });

    function processFile(file) {
      if (!/\.html?$/i.test(file.name)) { showToast('HTML 파일만 지원합니다.'); return; }
      savedFilename = file.name.replace(/\.html?$/i, '');
      fnameBadge.textContent = file.name;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const html = buildReport(e.target.result);
          generatedHTML = html;
          preview.innerHTML = html;
          dropzone.style.display = 'none';
          resultSec.style.display = 'block';
        } catch(err) {
          showToast('파일 분석 오류: ' + err.message);
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function buildReport(rawHTML) {
      const doc = new DOMParser().parseFromString(rawHTML, 'text/html');

      const val = id => {
        const el = doc.querySelector(`[data-id="${id}"]`);
        return el ? (el.getAttribute('data-value') || '').trim() : '';
      };

      /* 인라인 스타일에서 폰트 관련 속성만 제거 */
      const stripFonts = html => {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        tmp.querySelectorAll('[style]').forEach(el => {
          const s = el.style;
          ['font-family','font-size','line-height','margin-top','margin-bottom'].forEach(p => s.removeProperty(p));
          if (!el.getAttribute('style').trim()) el.removeAttribute('style');
        });
        return tmp.innerHTML;
      };

      const inner = id => {
        const el = doc.querySelector(`[data-id="${id}"]`);
        if (!el) return '';
        const clone = el.cloneNode(true);
        clone.querySelectorAll('script').forEach(s => s.remove());
        return stripFonts(clone.innerHTML);
      };

      const woNo        = val('editorForm_4');
      const project     = val('editorForm_5');
      const caseContent = inner('editorForm_11');
      const amountHTML  = inner('editorForm_13');
      const collab      = inner('editorForm_14');

      extractedData = { woNo, project, caseContent, amountHTML, collab };

      return `<div class="report-card">
  <div class="report-header">
    <div>
      <div class="report-main-title">원가절감 실적</div>
    </div>
  </div>

  <div class="report-fields">
    <div class="report-field">
      <div class="field-label">접수번호</div>
      <div class="field-value">
        <input id="receipt-no" class="receipt-input" type="text" placeholder="접수번호를 입력하세요" />
      </div>
    </div>
    <div class="report-field">
      <div class="field-label">공사번호</div>
      <div class="field-value">${woNo || '—'}</div>
    </div>
    <div class="report-field">
      <div class="field-label">PROJECT</div>
      <div class="field-value">${project || '—'}</div>
    </div>
    <div class="report-field">
      <div class="field-label">원가절감 사례내용</div>
      <div class="field-value">${caseContent || '—'}</div>
    </div>
    <div class="report-field">
      <div class="field-label">원가절감 금액</div>
      <div class="field-value">${amountHTML || '—'}</div>
    </div>
    <div class="report-field">
      <div class="field-label">공동협력인원</div>
      <div class="field-value">${collab || '—'}</div>
    </div>
  </div>

  <div class="report-footer">
    <span>회사 발전을 위한 귀하의 노고에 깊이 감사드립니다.</span>
  </div>
</div>`;
    }

    function outputCSS() {
      return `* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #fff; padding: 40px; }
.report-card { max-width: 820px; margin: 0 auto; }
.report-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; gap: 20px; }
.report-badge { display: inline-block; background: #dbeafe; color: #1d4ed8; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; margin-bottom: 8px; }
.report-main-title { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; line-height: 1.3; }
.report-meta-right { text-align: right; flex-shrink: 0; }
.report-meta-right .meta-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
.report-meta-right .meta-value { font-size: 13px; font-weight: 600; color: #374151; }
.report-fields { display: flex; flex-direction: column; }
.report-field { display: grid; grid-template-columns: 140px 1fr; border-bottom: 1px solid #f1f5f9; }
.report-field:last-child { border-bottom: none; }
.field-label { padding: 14px 16px; font-size: 12px; font-weight: 600; color: #64748b; background: #f8fafc; display: flex; align-items: flex-start; border-right: 1px solid #f1f5f9; }
.field-value { padding: 14px 18px; font-size: 13.5px; color: #1e293b; line-height: 1.75; word-break: break-word; }
.field-value img { max-width: 100%; height: auto; display: block; }
.field-value.highlight { font-size: 15px; font-weight: 700; color: #0f172a; }
.report-footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid #e2e8f0; text-align: center; }
.report-footer span { font-size: 13px; font-weight: 500; color: #475569; }`;
    }

    function fullHTML() {
      /* 현재 DOM에서 접수번호 값을 읽어 input → 정적 span으로 변환 */
      const clone = preview.cloneNode(true);
      const inp = clone.querySelector('#receipt-no');
      if (inp) {
        const span = document.createElement('span');
        span.textContent = inp.value || '—';
        inp.replaceWith(span);
      }
      const bodyContent = clone.innerHTML;

      return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원가절감 사례 보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
${outputCSS()}
</style>
</head>
<body>
${bodyContent}
</body>
</html>`;
    }

    /* 게시판 호환용: 인라인 스타일 + HTML 조각 (헤드/클래스 없음) */
    function buildInlineHTML() {
      const { woNo, project, caseContent, amountHTML, collab } = extractedData;
      const receiptNo = document.getElementById('receipt-no')?.value || '—';

      const TH = `padding:12px 14px; background:#f8fafc; border:1px solid #e2e8f0; width:130px; font-size:12px; font-weight:600; color:#64748b; vertical-align:top; font-family:'Malgun Gothic',dotum,Arial,sans-serif;`;
      const TD = `padding:12px 16px; border:1px solid #e2e8f0; font-size:13px; line-height:1.75; color:#1e293b; font-family:'Malgun Gothic',dotum,Arial,sans-serif; word-break:break-word;`;

      return `<div style="font-family:'Malgun Gothic',dotum,Arial,sans-serif; max-width:820px; margin:0 auto;">
  <div style="font-size:21px; font-weight:700; color:#0f172a; margin-bottom:20px; padding-bottom:16px; border-bottom:2px solid #e2e8f0;">원가절감 사례 보고서</div>
  <table style="width:100%; border-collapse:collapse;">
    <tr>
      <td style="${TH}">접수번호</td>
      <td style="${TD} font-weight:600;">${receiptNo}</td>
    </tr>
    <tr>
      <td style="${TH}">공사번호</td>
      <td style="${TD}">${woNo || '—'}</td>
    </tr>
    <tr>
      <td style="${TH}">PROJECT</td>
      <td style="${TD}">${project || '—'}</td>
    </tr>
    <tr>
      <td style="${TH}">원가절감<br>사례내용</td>
      <td style="${TD}">${caseContent || '—'}</td>
    </tr>
    <tr>
      <td style="${TH}">원가절감<br>금액</td>
      <td style="${TD}">${amountHTML || '—'}</td>
    </tr>
    <tr>
      <td style="${TH}">공동협력인원</td>
      <td style="${TD}">${collab || '—'}</td>
    </tr>
  </table>
  <div style="margin-top:28px; padding-top:18px; border-top:1px solid #e2e8f0; text-align:center; font-size:13px; font-weight:500; color:#475569; font-family:'Malgun Gothic',dotum,Arial,sans-serif;">
    회사 발전을 위한 귀하의 노고에 깊이 감사드립니다.
  </div>
</div>`;
    }

    function copyHTML() {
      const html = buildInlineHTML();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(html)
          .then(() => showToast('클립보드에 복사되었습니다'))
          .catch(() => fallbackCopy(html));
      } else {
        fallbackCopy(html);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('클립보드에 복사되었습니다');
    }

    function saveHTML() {
      const blob = new Blob([fullHTML()], { type: 'text/html;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = (savedFilename || '원가절감_보고서') + '_게시용.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('파일이 저장되었습니다');
    }

    function reset() {
      dropzone.style.display = 'block';
      resultSec.style.display = 'none';
      preview.innerHTML = '';
      fileInput.value = '';
      generatedHTML = '';
      savedFilename = '';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
  </script>
</body>
</html>
